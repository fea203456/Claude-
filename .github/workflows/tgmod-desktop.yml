name: TgMod Desktop (Linux)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tgmod/**'
      - '.github/workflows/tgmod-desktop.yml'

concurrency:
  group: tgmod-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      IMAGE: ghcr.io/telegramdesktop/tdesktop/centos_env:latest
      API_ID: ${{ secrets.TDESKTOP_API_ID }}
      API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    steps:
      - name: Clone mod.
        uses: actions/checkout@v4

      - name: Free up some disk space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Clone Telegram Desktop.
        run: |
          TAG=$(cat tgmod/UPSTREAM_TAG)
          git clone --depth 1 --branch "$TAG" \
            https://github.com/telegramdesktop/tdesktop.git tdesktop
          git -C tdesktop submodule update --init --recursive --depth 1 --jobs 8

      - name: Apply mod.
        run: tgmod/apply.sh tdesktop

      - name: Restore compiler cache.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: tgmod-linux-ccache-${{ hashFiles('tgmod/UPSTREAM_TAG') }}-${{ github.run_id }}
          restore-keys: tgmod-linux-ccache-${{ hashFiles('tgmod/UPSTREAM_TAG') }}-

      - name: Build.
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API_ARGS="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are not set, building with the public test credentials (login may be refused)."
            API_ARGS="-D TDESKTOP_API_TEST=ON"
          fi
          cd tdesktop
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$RUNNER_TEMP/ccache:/var/cache/ccache" \
            -e CONFIG=Debug \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE" \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            $API_ARGS

      - name: Collect artifact.
        run: |
          test -f tdesktop/out/Debug/Telegram
          mkdir artifact
          cp tdesktop/out/Debug/Telegram artifact/TgMod
          strip artifact/TgMod || true
          ls -lh artifact

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: TgMod-linux-x86_64
          path: artifact/
          retention-days: 14
