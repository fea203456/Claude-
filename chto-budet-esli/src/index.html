<style>
@font-face{font-family:Rubik;font-weight:800;src:url(fonts/rubik-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

@font-face{font-family:Pangolin;src:url(fonts/pangolin-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Pangolin;src:url(fonts/pangolin-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF}

</style></head><body><canvas id="c"></canvas>
<script src="lib.js"></script><script src="scenes.js"></script><script src="cues.js"></script>
<script>
const q = new URLSearchParams(location.search), PN = q.get('part') || '1';
const s = document.createElement('script'); s.src = 'part' + PN + '.js';
window.ready = new Promise(res => { s.onload = async () => {
  await Promise.all(['900 80px Rubik','800 80px Rubik','80px Pangolin'].map(f => document.fonts.load(f, 'Аа0')));
  PART = window['PART' + PN]; res();
  if (!q.has('render')) { const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % PART.dur; renderAt(t, 1); requestAnimationFrame(loop); }; loop(); }
}; });
document.body.appendChild(s);
</script></body></html>
