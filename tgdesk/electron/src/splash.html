<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>TgMod</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; }
  .card {
    box-sizing: border-box; height: 100%; border-radius: 24px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; color: #f3efff;
    background: radial-gradient(120% 90% at 20% 0%, #3a1d7a 0%, #160f33 55%, #0a0817 100%);
    border: 1px solid rgba(166, 107, 255, .35);
  }
  img { width: 112px; height: 112px; filter: drop-shadow(0 0 22px rgba(123, 63, 242, .6)); animation: float 3s ease-in-out infinite; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; font-weight: 600; }
  p { margin: 0; font-size: 13px; color: #a9a2d4; min-height: 18px; }
  .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #a66bff, #2d7ff9); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { img, .bar::after { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/icon.png" alt="">
    <h1>TgMod</h1>
    <div class="bar"></div>
    <p id="status">Запуск…</p>
  </div>
  <script>
    window.setStatus = (text) => { document.getElementById('status').textContent = text; };
  </script>
</body>
</html>
