<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TgMod promo</title>
<style>
  @font-face {
    font-family: "Unbounded";
    src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
    font-weight: 200 900;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Unbounded";
    src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
    font-weight: 200 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --violet: #a66bff;
    --blue: #2d7ff9;
    --cyan: #5ad7ff;
    --ink: #f3efff;
    --muted: #a9a2d4;
  }

  html, body { margin: 0; background: #07051a; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 10%, #1f1150 0%, #0d0828 50%, #06041a 100%);
    font-family: Inter, sans-serif; color: var(--ink);
  }
  canvas.layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; left: 0; top: 0; }
  .world { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 46%; }
  .plane { position: absolute; left: 0; top: 0; transform-style: preserve-3d; will-change: transform, opacity, filter; }
  .hide { display: none; }

  /* the soap bubble, as in the mod */
  .bubble {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.8) 0, rgba(255,255,255,.22) 8%, transparent 19%),
      radial-gradient(circle at 70% 78%, rgba(255,255,255,.28) 0, transparent 13%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.03) 55%, rgba(190,220,255,.18) 72%, rgba(255,255,255,.5) 98%, rgba(255,255,255,.1) 100%);
    box-shadow: inset 0 0 18px rgba(255,255,255,.25), inset -14px -20px 40px rgba(140,170,255,.18), 0 20px 60px rgba(0,0,0,.25);
  }
  .bubble::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from var(--film, 0deg), rgba(255,120,200,.3), rgba(120,220,255,.28), rgba(255,240,140,.24), rgba(160,255,190,.24), rgba(255,120,200,.3));
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 75%);
    mix-blend-mode: screen;
  }
  .bubble img { position: absolute; inset: 21%; width: 58%; height: 58%; }

  .title {
    font-family: Unbounded, sans-serif; font-weight: 800; letter-spacing: -.02em; white-space: nowrap;
  }
  .letter { display: inline-block; will-change: transform, opacity; }
  .gradient-text {
    background: linear-gradient(100deg, #ffffff 0%, #e5d6ff 40%, #9fd8ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-family: Inter, sans-serif; font-weight: 500; color: var(--muted); white-space: nowrap; }

  .heading { position: absolute; left: 120px; top: 92px; font-size: 76px; line-height: 1; }
  .heading-sub { position: absolute; left: 124px; top: 192px; font-size: 30px; }

  .corner {
    position: absolute; right: 64px; top: 52px; display: flex; align-items: center; gap: 14px;
    font-family: Unbounded, sans-serif; font-weight: 800; font-size: 28px; color: #fff;
  }
  .corner img { width: 52px; height: 52px; }

  /* scene 2 cards */
  .card {
    position: absolute; width: 360px; height: 691px; border-radius: 34px; overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    background: #111;
  }
  .card img { width: 100%; height: 100%; display: block; }
  .chip {
    position: absolute; left: 50%; top: 718px; transform: translateX(-50%);
    padding: 12px 22px 12px 18px; border-radius: 40px; display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    font: 600 26px Inter, sans-serif; color: #fff; white-space: nowrap;
  }
  .chip i { width: 18px; height: 18px; border-radius: 50%; display: block; }

  /* scene 3 window */
  .win {
    position: absolute; width: 1180px; height: 680px; border-radius: 28px; overflow: hidden;
    background: #0e0b1f; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(166,107,255,.3);
    display: flex;
  }
  .chat { flex: 1; display: flex; flex-direction: column; background: linear-gradient(180deg, #120d2a, #0e0b1f); position: relative; }
  .chat-top { height: 92px; display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid #2a2450; background: #161229; }
  .ava { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font: 700 22px Inter; color: #fff;
    background: linear-gradient(135deg, #ff8fc0, #a66bff); }
  .name { font: 700 24px Inter; }
  .status { font: 500 18px Inter; color: #5ad7ff; margin-top: 4px; }
  .msgs { flex: 1; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .msg { align-self: flex-start; max-width: 60%; padding: 14px 20px; border-radius: 22px 22px 22px 6px; background: #1d1838; font: 500 22px Inter; }
  .msg.out { align-self: flex-end; border-radius: 22px 22px 6px 22px; background: linear-gradient(135deg, #7b3ff2, #2d7ff9); }
  .msg small { font-size: 15px; color: rgba(255,255,255,.65); margin-left: 12px; }
  .panel { width: 430px; background: #161229; border-left: 1px solid #2a2450; padding: 30px 26px; box-sizing: border-box; }
  .panel h3 { margin: 0 0 6px; font: 800 26px Unbounded, sans-serif; color: #fff; }
  .panel p { margin: 0 0 22px; font: 500 16px Inter; color: #8f88b8; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid #241f45; font: 500 19px Inter; color: #eae6ff; }
  .toggle { flex: none; width: 58px; height: 34px; border-radius: 17px; background: #3a3460; position: relative; }
  .toggle b { position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .seen {
    position: absolute; left: 28px; bottom: 28px; width: 470px; padding: 22px 24px; border-radius: 22px; box-sizing: border-box;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  }
  .seen h4 { margin: 0 0 14px; font: 700 18px Inter; color: #8f88b8; text-transform: uppercase; letter-spacing: .06em; }
  .seen div { position: relative; height: 34px; font: 600 22px Inter; }
  .seen span { position: absolute; left: 0; top: 0; white-space: nowrap; }

  /* scene 4 */
  .phone { position: absolute; width: 520px; height: 998px; border-radius: 48px; overflow: hidden; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 10px #1a1530, 0 0 0 11px rgba(255,255,255,.12); }
  .phone img { position: absolute; left: 0; top: 0; width: 520px; height: 998px; }
  .hl { position: absolute; border-radius: 18px; border: 3px solid #5ad7ff; box-shadow: 0 0 30px rgba(90,215,255,.6); }
  .pill {
    position: absolute; padding: 16px 26px; border-radius: 40px; font: 600 26px Inter; color: #fff; white-space: nowrap;
    background: rgba(29,24,56,.92); border: 1px solid rgba(166,107,255,.5); box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .toast {
    position: absolute; width: 560px; padding: 24px 28px; border-radius: 26px; box-sizing: border-box;
    background: rgba(22,18,41,.95); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.55);
    display: flex; gap: 20px; align-items: center;
  }
  .toast .ava { flex: none; }
  .toast b { font: 700 24px Inter; display: block; }
  .toast span { font: 500 20px Inter; color: #a9a2d4; }
  .wave { position: absolute; display: flex; align-items: center; gap: 10px; height: 160px; }
  .wave i { display: block; width: 14px; border-radius: 7px; background: linear-gradient(180deg, #5ad7ff, #a66bff); }

  /* scene 6 */
  .shot { position: absolute; width: 760px; height: 722px; border-radius: 34px; overflow: hidden; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); backface-visibility: hidden; }
  .shot canvas, .shot img { position: absolute; left: 0; top: 0; width: 760px; }
  .callout { position: absolute; display: flex; align-items: center; gap: 14px; font: 700 30px Inter; white-space: nowrap; }
  .callout i { width: 14px; height: 14px; border-radius: 50%; background: #5ad7ff; box-shadow: 0 0 16px #5ad7ff; display: block; }
  .ring { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #a66bff, #2d7ff9); }

  .cursor { position: absolute; width: 44px; height: 44px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer" width="1920" height="1080"></canvas>
  <div id="world" class="world"></div>
  <canvas id="fx" class="layer" width="1920" height="1080"></canvas>
  <div id="hud" class="abs" style="width:1920px;height:1080px"></div>
</div>
<script>
'use strict';
// ---------- helpers ----------
const W = 1920, H = 1080, DURATION = 37;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);
const back = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
// * a damped spring from 0 to 1 over time t (seconds)
const spring = (t, freq = 2.2, damp = 5.5) => t <= 0 ? 0 : 1 - Math.exp(-damp * t) * Math.cos(freq * 2 * Math.PI * t);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; parent && parent.appendChild(e); return e; };
const set = (e, o, tr, extra) => { e.style.opacity = o; if(tr !== undefined) e.style.transform = tr; if(o <= 0.001) e.style.visibility = 'hidden'; else e.style.visibility = 'visible'; if(extra) Object.assign(e.style, extra); };
const lettersOf = (parent, text, cls = 'letter') => [...text].map((ch) => { const s = el('span', cls, parent); s.textContent = ch === ' ' ? ' ' : ch; return s; });

const world = document.getElementById('world');
const hud = document.getElementById('hud');
const bg = document.getElementById('bg').getContext('2d');
const fx = document.getElementById('fx').getContext('2d');

// ---------- assets ----------
const ASSET = {
  icon: 'assets/icon.png',
  themes: ['neon', 'amoled', 'glass', 'sunset', 'mint'].map((id) => `assets/ui/theme-${id}.png`),
  orbit: 'assets/ui/orbit.png'
};
const footage = [];
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

// ---------- background bubble field ----------
const field = [];
{
  const r = rng(7);
  const layers = [{n: 22, rmin: 6, rmax: 16, depth: .35, blur: 5, alpha: .45}, {n: 16, rmin: 18, rmax: 34, depth: .7, blur: 0, alpha: .8}, {n: 7, rmin: 48, rmax: 90, depth: 1.25, blur: 6, alpha: .55}];
  layers.forEach((L, li) => { for(let i = 0; i < L.n; ++i) field.push({layer: li, ...L, x: r() * W, y: r() * H, vx: (r() - .5) * 24, vy: -8 - r() * 18, rad: lerp(L.rmin, L.rmax, r()), ph: r() * 6.28}); });
}
function drawBubble(ctx, x, y, rad, alpha, t, ph) {
  ctx.save();
  ctx.globalAlpha = alpha;
  let g = ctx.createRadialGradient(x, y, rad * .55, x, y, rad);
  g.addColorStop(0, 'rgba(255,255,255,0.02)'); g.addColorStop(.75, 'rgba(180,210,255,0.16)'); g.addColorStop(.97, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  // * iridescent rim
  ctx.lineWidth = Math.max(1, rad * .07);
  const hue = (t * 40 + ph * 60) % 360;
  ctx.strokeStyle = `hsla(${hue}, 90%, 75%, .35)`;
  ctx.beginPath(); ctx.arc(x, y, rad * .93, ph, ph + Math.PI * 1.1); ctx.stroke();
  ctx.strokeStyle = `hsla(${(hue + 140) % 360}, 90%, 75%, .28)`;
  ctx.beginPath(); ctx.arc(x, y, rad * .93, ph + Math.PI * 1.2, ph + Math.PI * 1.9); ctx.stroke();
  // * window of light
  g = ctx.createRadialGradient(x - rad * .38, y - rad * .45, 0, x - rad * .38, y - rad * .45, rad * .35);
  g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x - rad * .38, y - rad * .45, rad * .35, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// camera for the field: zoom about the centre, pan, and the final gathering
function cameraField(t) {
  const zoom = 1 + easeIn(seg(t, 0, 3)) * .9 - easeOut(seg(t, 3, 4)) * .9;
  const pan = lerp(-160, 160, easeInOut(seg(t, 4, 11.5))) + lerp(0, -220, easeInOut(seg(t, 12, 24))) + lerp(0, 200, easeInOut(seg(t, 24, 32)));
  const gather = easeInOut(seg(t, 32, 33.4));
  return {zoom, pan, gather};
}
// * each bubble is drawn once into a sprite, its depth-of-field blur baked in: a canvas filter on every
// * draw call made each frame take seconds to rasterize
function bakeSprites() {
  for(const b of field) {
    const maxR = b.rad * (1 + .9 * b.depth) * 1.05;
    const pad = b.blur * 3 + 4;
    const size = Math.ceil(maxR * 2 + pad * 2);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    if(b.blur) ctx.filter = `blur(${b.blur * (maxR / b.rad)}px)`;
    drawBubble(ctx, size / 2, size / 2, maxR, 1, 0, b.ph);
    b.sprite = c; b.spriteR = maxR; b.spritePad = pad;
  }
}
function drawField(t) {
  bg.clearRect(0, 0, W, H);
  const cam = cameraField(t);
  for(const L of [0, 1, 2]) {
    for(const b of field) {
      if(b.layer !== L) continue;
      let x = ((b.x + b.vx * t - cam.pan * b.depth) % (W + 200) + W + 200) % (W + 200) - 100;
      let y = ((b.y + b.vy * t) % (H + 200) + H + 200) % (H + 200) - 100;
      // * the zoom pushes outwards, more for near layers
      const z = 1 + (cam.zoom - 1) * b.depth;
      x = W / 2 + (x - W / 2) * z; y = H / 2 + (y - H / 2) * z;
      let rad = b.rad * z;
      if(cam.gather > 0) {
        x = lerp(x, W / 2, cam.gather); y = lerp(y, H / 2 - 60, cam.gather); rad *= 1 - cam.gather * .85;
      }
      const alpha = b.alpha * (1 - easeIn(seg(t, 33.2, 33.6)));
      if(alpha <= 0 || rad < .5) continue;
      // * the sprite turns slowly, so the film's colours move round the rim
      const k = rad / b.spriteR;
      const half = (b.sprite.width / 2) * k;
      bg.save();
      bg.globalAlpha = alpha;
      bg.translate(x, y);
      bg.rotate(t * .35 + b.ph);
      bg.drawImage(b.sprite, -half, -half, half * 2, half * 2);
      bg.restore();
    }
  }
}

// ---------- HUD: corner logo ----------
const corner = el('div', 'corner', hud, `<img src="${ASSET.icon}"><span>TgMod</span>`);

// ---------- scene 1: the bubble pops into the title ----------
const s1 = el('div', 'plane', world);
const heroBubble = el('div', 'bubble', s1, `<img src="${ASSET.icon}">`);
const titleWrap = el('div', 'abs title', hud);
titleWrap.style.cssText += 'left:0;top:0;width:1920px;text-align:center;font-size:190px;';
const titleLetters = lettersOf(el('div', '', titleWrap), 'TgMod', 'letter gradient-text');
const titleSub = el('div', 'abs sub', hud, 'Telegram-клиент с модами для Windows');
titleSub.style.cssText += 'width:1920px;text-align:center;font-size:40px;';
const titleIcon = el('img', 'abs', hud); titleIcon.src = ASSET.icon;
const drops = []; { const r = rng(11); for(let i = 0; i < 26; ++i) { const a = r() * 6.283; const sp = 380 + r() * 620; drops.push({vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, r: 3 + r() * 7}); } }

function scene1(t) {
  // * the hero bubble: dolly in, wobble, pop at 3.0
  const approach = easeIn(seg(t, 0, 2.9));
  const size = lerp(150, 560, approach);
  const wob = Math.sin(t * 7) * (.03 + seg(t, 2.2, 2.95) * .09);
  const pop = seg(t, 3.0, 3.14);
  const cx = W / 2 + Math.sin(t * 1.3) * 30 * (1 - approach), cy = H / 2 + Math.cos(t * 1.1) * 18 * (1 - approach);
  heroBubble.style.width = heroBubble.style.height = size + 'px';
  heroBubble.style.setProperty('--film', (t * 70) + 'deg');
  set(heroBubble, t < 3.14 ? (1 - pop) * clamp(t / .4) : 0,
    `translate(${cx - size / 2}px, ${cy - size / 2}px) rotate(${Math.sin(t) * 6}deg) scale(${(1 + wob) * (1 + pop * .25)}, ${(1 - wob * .8) * (1 + pop * .25)})`);
  // * the icon survives the pop and rises
  const iconUp = easeOutQuint(seg(t, 3.0, 3.7));
  const iconSize = lerp(size * .58, 150, iconUp);
  const iconOut = easeInOut(seg(t, 3.75, 4.35));
  set(titleIcon, t >= 3.0 ? 1 - iconOut : 0,
    `translate(${W / 2 - iconSize / 2}px, ${lerp(cy - iconSize / 2, 250, iconUp)}px) scale(${1 - iconOut * .3})`,
    {width: iconSize + 'px', height: iconSize + 'px'});

  // * droplets
  fx.clearRect(0, 0, W, H);
  if(t >= 3.0 && t < 3.9) {
    const dt = t - 3.0;
    for(const d of drops) {
      const x = cx + d.vx * dt, y = cy + d.vy * dt + 900 * dt * dt;
      fx.fillStyle = `rgba(200,225,255,${.8 * (1 - dt / .9)})`;
      fx.beginPath(); fx.arc(x, y, d.r * (1 - dt / 1.2), 0, 6.283); fx.fill();
    }
    // * the shock ring
    fx.strokeStyle = `rgba(255,255,255,${.6 * (1 - seg(dt, 0, .35))})`; fx.lineWidth = 4;
    fx.beginPath(); fx.arc(cx, cy, size / 2 + easeOut(seg(dt, 0, .35)) * 260, 0, 6.283); fx.stroke();
  }

  // * the title letters drop in with weight, then the whole title leaves towards the corner
  const leave = easeInOut(seg(t, 3.75, 4.35));
  titleLetters.forEach((s, i) => {
    const lt = t - 3.08 - i * .055;
    const p = clamp(spring(lt, 1.6, 6.5), 0, 1.15);
    const y = (1 - p) * -140;
    const squash = lt > 0 && lt < .25 ? Math.sin(lt / .25 * Math.PI) * .12 : 0;
    set(s, lt > 0 ? clamp(lt / .12) : 0, `translateY(${y}px) scale(${1 + squash * .6}, ${1 - squash})`);
  });
  set(titleWrap, 1 - leave, `translate(${-leave * 300}px, ${430 - leave * 260}px) scale(${1 - leave * .5})`);
  const subIn = easeOut(seg(t, 3.35, 3.85));
  set(titleSub, subIn * (1 - leave), `translateY(${660 + (1 - subIn) * 30 - leave * 120}px)`);
  set(corner, easeOut(seg(t, 4.1, 4.6)) * (1 - easeIn(seg(t, 31.6, 32.2))), `translateY(${(1 - easeOut(seg(t, 4.1, 4.6))) * -20}px)`);
}

// ---------- headings shared by scenes 2–6 ----------
function makeHeading(text, sub) {
  const h = el('div', 'heading title', hud);
  const letters = lettersOf(h, text);
  const s = sub ? el('div', 'heading-sub sub', hud, sub) : null;
  return {h, letters, s};
}
function showHeading(head, t, a, b, opts = {}) {
  const inP = seg(t, a, a + .6), outP = seg(t, b - .45, b);
  head.letters.forEach((s, i) => {
    const p = easeOutQuint(clamp((t - a - i * .022) / .5));
    const o = easeIn(clamp((t - (b - .45) - i * .01) / .3));
    let op = p * (1 - o);
    if(opts.ghost) op *= .35 + .65 * (.5 + .5 * Math.cos((t - a) * 4 - i * .55));
    set(s, op, `translateY(${(1 - p) * 60 + o * -40}px) rotate(${(1 - p) * 8}deg)`);
  });
  set(head.h, t > a - .1 && t < b + .1 ? 1 : 0);
  if(head.s) { const sp = easeOut(seg(t, a + .25, a + .8)); set(head.s, sp * (1 - outP), `translateY(${(1 - sp) * 20}px)`); }
}

// ---------- scene 2: themes on an arc ----------
const s2 = el('div', 'plane', world);
s2.style.left = (W / 2) + 'px'; s2.style.top = (H / 2) + 'px';
const THEME_NAMES = [['Неон', '#a66bff'], ['AMOLED', '#ffffff'], ['Стекло', '#9fb4ff'], ['Закат', '#f2622e'], ['Мята', '#14a689']];
const cards = THEME_NAMES.map(([name, color], i) => {
  const c = el('div', 'plane', s2);
  const card = el('div', 'card', c, `<img src="${ASSET.themes[i]}">`);
  card.style.left = '-180px'; card.style.top = '-380px';
  const chip = el('div', 'chip', c, `<i style="background:${color}"></i>${name}`);
  chip.style.left = '0'; chip.style.top = '338px';

  set(endWrap, t > 33.4 ? 1 : 0, 'translateY(450px)');
  const lp = easeOut(seg(t, 33.9, 34.5));
  set(endLine, lp, `translateY(${650 + (1 - lp) * 20}px)`);
  const np = easeOut(seg(t, 34.3, 34.9));
  set(endNote, np, `translateY(${980}px)`);
  // * a slow final drift, so the last frame is not frozen
  hud.style.transform = t > 33 ? `scale(${1 + (t - 33) * .006})` : '';
  hud.style.transformOrigin = '50% 45%';
}

// ---------- timeline ----------
const ONLY = new URLSearchParams(location.search).get('only');
window.renderAt = function(t) {
  const run = (name, fn) => { if(!ONLY || ONLY.split(',').includes(name)) fn(t); };
  run('field', drawField);
  run('1', scene1); run('2', scene2); run('3', scene3); run('4', scene4); run('5', scene5); run('6', scene6); run('7', scene7);
};
window.ready = (async() => {
  await document.fonts.load('800 80px Unbounded'); await document.fonts.load('500 30px Unbounded'); await document.fonts.load('600 30px Inter');
  await Promise.all([ASSET.icon, ASSET.orbit, ...ASSET.themes].map(loadImage));
  bakeSprites();
  const list = [];
  const FOOTAGE_COUNT = new URLSearchParams(location.search).has('nofootage') ? 0 : 360;
  for(let i = 0; i < FOOTAGE_COUNT; ++i) list.push(loadImage(`assets/ui/bubbles/${String(i).padStart(4, '0')}.png`).then((img) => footage[i] = img));
  await Promise.all(list);
  await document.fonts.ready;
  window.renderAt(0);
  return true;
})();
</script>
